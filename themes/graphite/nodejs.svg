<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<metadata>Dark metallic mobile theme — Graphite + steel blue — generated from svg/nodejs.svg</metadata>
  <defs>
    <linearGradient id="mt-base" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#39424e"/>
      <stop offset="0.52" stop-color="#212933"/>
      <stop offset="1" stop-color="#0f141b"/>
    </linearGradient>
    <radialGradient id="mt-sheen" cx="0.24" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#cfe4ff" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#cfe4ff" stop-opacity="0.039"/>
      <stop offset="1" stop-color="#cfe4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mt-rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#9fb6cf" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#2f3b48" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d89a6" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="mt-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mt-brush" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <path d="M0 0v6" stroke="#dbe9ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <clipPath id="mt-clip">
      <rect x="8" y="8" width="240" height="240" rx="58"/>
    </clipPath>
    <filter id="mt-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="mt-inset" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="mt-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#c8dcf2" flood-opacity="0.62"/>
    </filter>
  </defs>

  <!-- metal tile -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#mt-base)"/>
  <g clip-path="url(#mt-clip)">
    <rect x="8" y="8" width="240" height="240" fill="url(#mt-brush)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#mt-sheen)"/>
    <!-- inner shadow around the edges -->
    <rect x="15" y="15" width="226" height="226" rx="52"
          fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="16" filter="url(#mt-inset)"/>
    <!-- top face highlight -->
    <rect x="8" y="8" width="240" height="240" fill="url(#mt-top)"/>
  </g>
  <!-- metallic rim -->
  <rect x="9" y="9" width="238" height="238" rx="57"
        fill="none" stroke="url(#mt-rim)" stroke-width="2"/>
  <!-- machined face the artwork sits on -->
  <rect x="42" y="42" width="172" height="172" rx="40" fill="#ffffff" fill-opacity="0.055"/>
  <rect x="42" y="42" width="172" height="172" rx="40" fill="none" stroke="url(#mt-rim)" stroke-opacity="0.75" stroke-width="2"/>

  <!-- artwork -->
  <g transform="translate(44.0000 44.0000) scale(1.312500)">
    <g filter="url(#mt-halo)">
      <g filter="url(#mt-shadow)">
<path fill="url(#a)" d="M66.958.825a6.07 6.07 0 0 0-6.035 0L11.103 29.76c-1.895 1.072-2.96 3.095-2.96 5.24v57.988c0 2.143 1.183 4.167 2.958 5.24l49.82 28.934a6.07 6.07 0 0 0 6.036 0l49.82-28.935c1.894-1.072 2.958-3.096 2.958-5.24V35c0-2.144-1.183-4.167-2.958-5.24z"/><path fill="url(#b)" d="M116.897 29.76 66.841.825A8.161 8.161 0 0 0 65.302.23L9.21 96.798a6.251 6.251 0 0 0 1.657 1.43l50.057 28.934c1.42.833 3.076 1.072 4.615.595l52.66-96.925a3.702 3.702 0 0 0-1.302-1.072z"/><path fill="url(#c)" d="M116.898 98.225c1.42-.833 2.485-2.262 2.958-3.81L65.066.108c-1.42-.238-2.959-.119-4.26.715L11.104 29.639l53.606 98.355c.71-.12 1.54-.358 2.25-.715z"/><defs><linearGradient id="a" x1="34.513" x2="27.157" y1="15.535" y2="30.448" gradientTransform="translate(-129.242 -73.715) scale(6.18523)" gradientUnits="userSpaceOnUse"><stop stop-color="#3F873F"/><stop offset=".33" stop-color="#3F8B3D"/><stop offset=".637" stop-color="#3E9638"/><stop offset=".934" stop-color="#3DA92E"/><stop offset="1" stop-color="#3DAE2B"/></linearGradient><linearGradient id="b" x1="30.009" x2="50.533" y1="23.359" y2="8.288" gradientTransform="translate(-129.242 -73.715) scale(6.18523)" gradientUnits="userSpaceOnUse"><stop offset=".138" stop-color="#3F873F"/><stop offset=".402" stop-color="#52A044"/><stop offset=".713" stop-color="#64B749"/><stop offset=".908" stop-color="#6ABF4B"/></linearGradient><linearGradient id="c" x1="21.917" x2="40.555" y1="22.261" y2="22.261" gradientTransform="translate(-129.242 -73.715) scale(6.18523)" gradientUnits="userSpaceOnUse"><stop offset=".092" stop-color="#6ABF4B"/><stop offset=".287" stop-color="#64B749"/><stop offset=".598" stop-color="#52A044"/><stop offset=".862" stop-color="#3F873F"/></linearGradient></defs>
      </g>
    </g>
  </g>
</svg>
