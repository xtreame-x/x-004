<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<metadata>Dark metallic mobile theme — Bronze — generated from svg/power-automate.svg</metadata>
  <defs>
    <linearGradient id="mt-base" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#4a4038"/>
      <stop offset="0.52" stop-color="#2b2420"/>
