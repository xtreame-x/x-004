<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<metadata>Dark metallic mobile theme — Gunmetal (default) — generated from svg/paint.svg</metadata>
  <defs>
    <linearGradient id="mt-base" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#3c444f"/>
      <stop offset="0.52" stop-color="#242a32"/>
      <stop offset="1" stop-color="#11151a"/>
    </linearGradient>
    <radialGradient id="mt-sheen" cx="0.24" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#dfe8f2" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#dfe8f2" stop-opacity="0.034"/>
      <stop offset="1" stop-color="#dfe8f2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mt-rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a8b4c2" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#39414b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#79879a" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="mt-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mt-brush" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <path d="M0 0v6" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="mt-clip">
      <rect x="8" y="8" width="240" height="240" rx="58"/>
    </clipPath>
    <filter id="mt-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="mt-inset" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="mt-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#c8dcf2" flood-opacity="0.62"/>
    </filter>
  </defs>

  <!-- metal tile -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#mt-base)"/>
  <g clip-path="url(#mt-clip)">
    <rect x="8" y="8" width="240" height="240" fill="url(#mt-brush)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#mt-sheen)"/>
    <!-- inner shadow around the edges -->
    <rect x="15" y="15" width="226" height="226" rx="52"
          fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="16" filter="url(#mt-inset)"/>
    <!-- top face highlight -->
    <rect x="8" y="8" width="240" height="240" fill="url(#mt-top)"/>
  </g>
  <!-- metallic rim -->
  <rect x="9" y="9" width="238" height="238" rx="57"
        fill="none" stroke="url(#mt-rim)" stroke-width="2"/>
  <!-- machined face the artwork sits on -->
  <rect x="42" y="42" width="172" height="172" rx="40" fill="#ffffff" fill-opacity="0.055"/>
  <rect x="42" y="42" width="172" height="172" rx="40" fill="none" stroke="url(#mt-rim)" stroke-opacity="0.75" stroke-width="2"/>

  <!-- artwork -->
  <g transform="translate(44.0000 44.0000) scale(0.656250)">
    <g filter="url(#mt-shadow)">
<defs>
    <linearGradient id="pal" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecf3"/>
    </linearGradient>
    <linearGradient id="brush" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4bb4f7"/>
      <stop offset="0.5" stop-color="#1a7fd4"/>
      <stop offset="1" stop-color="#0a52a6"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa7b5"/>
      <stop offset="0.4" stop-color="#f2f6fa"/>
      <stop offset="1" stop-color="#8d9aa8"/>
    </linearGradient>
    <linearGradient id="bristle" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="0.5" stop-color="#c98b4b"/>
      <stop offset="1" stop-color="#f5bd72"/>
    </linearGradient>
  </defs>

  <!-- palette -->
  <g transform="rotate(-8 108 128)">
    <path d="M104 50c40 0 72 26 72 60 0 21-13 33-29 33-11 0-16 6-16 14 0 9-9 15-22 15-4 0-8-1-12-3C64 159 32 136 32 106 32 74 62 50 104 50Z"
          fill="url(#pal)" stroke="#bec9d6" stroke-width="4"/>
  </g>
  <circle cx="68" cy="92" r="13" fill="#e81123"/>
  <circle cx="99" cy="77" r="13" fill="#ff8c00"/>
  <circle cx="132" cy="77" r="13" fill="#ffd400"/>
  <circle cx="160" cy="96" r="13" fill="#16a34a"/>
  <circle cx="165" cy="130" r="12" fill="#0a84ff"/>
  <circle cx="60" cy="126" r="12" fill="#8b5cf6"/>
  <g fill="#ffffff" opacity="0.45">
    <circle cx="64" cy="87" r="4"/><circle cx="95" cy="72" r="4"/>
    <circle cx="128" cy="72" r="4"/><circle cx="156" cy="91" r="4"/>
  </g>

  <!-- brush, on top -->
  <g transform="rotate(-52 162 138)">
    <path d="M162 34c9 0 16 14 16 30v18h-32V64c0-16 7-30 16-30Z" fill="url(#bristle)"/>
    <path d="M158 40c2 10 3 22 2 38h4c1-16 2-28 4-38z" fill="#ffffff" opacity="0.35"/>
    <rect x="146" y="82" width="32" height="30" rx="4" fill="url(#ferrule)"/>
    <path d="M146 88h32M146 104h32" stroke="#ffffff" stroke-width="3" opacity="0.55"/>
    <rect x="152" y="112" width="20" height="106" rx="10" fill="url(#brush)"/>
    <rect x="156" y="122" width="4" height="86" rx="2" fill="#ffffff" opacity="0.4"/>
  </g>

    </g>
  </g>
</svg>
