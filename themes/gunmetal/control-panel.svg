<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<metadata>Dark metallic mobile theme — Gunmetal (default) — generated from svg/control-panel.svg</metadata>
  <defs>
    <linearGradient id="mt-base" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#3c444f"/>
      <stop offset="0.52" stop-color="#242a32"/>
      <stop offset="1" stop-color="#11151a"/>
    </linearGradient>
    <radialGradient id="mt-sheen" cx="0.24" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#dfe8f2" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#dfe8f2" stop-opacity="0.034"/>
      <stop offset="1" stop-color="#dfe8f2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mt-rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a8b4c2" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#39414b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#79879a" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="mt-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mt-brush" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <path d="M0 0v6" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="mt-clip">
      <rect x="8" y="8" width="240" height="240" rx="58"/>
    </clipPath>
    <filter id="mt-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="mt-inset" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="mt-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#c8dcf2" flood-opacity="0.62"/>
    </filter>
  </defs>

  <!-- metal tile -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#mt-base)"/>
  <g clip-path="url(#mt-clip)">
    <rect x="8" y="8" width="240" height="240" fill="url(#mt-brush)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#mt-sheen)"/>
    <!-- inner shadow around the edges -->
    <rect x="15" y="15" width="226" height="226" rx="52"
          fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="16" filter="url(#mt-inset)"/>
    <!-- top face highlight -->
    <rect x="8" y="8" width="240" height="240" fill="url(#mt-top)"/>
  </g>
  <!-- metallic rim -->
  <rect x="9" y="9" width="238" height="238" rx="57"
        fill="none" stroke="url(#mt-rim)" stroke-width="2"/>
  <!-- machined face the artwork sits on -->
  <rect x="42" y="42" width="172" height="172" rx="40" fill="#ffffff" fill-opacity="0.055"/>
  <rect x="42" y="42" width="172" height="172" rx="40" fill="none" stroke="url(#mt-rim)" stroke-opacity="0.75" stroke-width="2"/>

  <!-- artwork -->
  <g transform="translate(44.0000 44.0000) scale(0.656250)">
    <g filter="url(#mt-shadow)">
<defs>
    <linearGradient id="mon" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f7fafd"/>
      <stop offset="1" stop-color="#dfe7f0"/>
    </linearGradient>
    <linearGradient id="monb" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5ea9e8"/>
      <stop offset="1" stop-color="#155e9e"/>
    </linearGradient>
  </defs>

  <rect x="18" y="28" width="220" height="160" rx="16" fill="url(#monb)"/>
  <rect x="32" y="42" width="192" height="120" rx="8" fill="url(#mon)"/>
  <path d="M104 188h48l6 22h-60z" fill="url(#monb)"/>
  <rect x="82" y="208" width="92" height="14" rx="7" fill="url(#monb)"/>

  <!-- sliders -->
  <g>
    <rect x="52" y="72" width="152" height="10" rx="5" fill="#c7d3e0"/>
    <circle cx="96" cy="77" r="13" fill="#0a66c2"/>
    <circle cx="96" cy="77" r="5" fill="#ffffff"/>
  </g>
  <g>
    <rect x="52" y="104" width="152" height="10" rx="5" fill="#c7d3e0"/>
    <circle cx="164" cy="109" r="13" fill="#0a66c2"/>
    <circle cx="164" cy="109" r="5" fill="#ffffff"/>
  </g>
  <g>
    <rect x="52" y="136" width="152" height="10" rx="5" fill="#c7d3e0"/>
    <circle cx="124" cy="141" r="13" fill="#0a66c2"/>
    <circle cx="124" cy="141" r="5" fill="#ffffff"/>
  </g>

    </g>
  </g>
</svg>
