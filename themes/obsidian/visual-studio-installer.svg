  </g>
  <circle cx="196" cy="190" r="44" fill="#ffffff"/>
  <circle cx="196" cy="190" r="36" fill="url(#vbadge)"/>
  <path d="M196 168v30" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M180 196l16 16 16-16" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    </g>
  </g>
</svg>
