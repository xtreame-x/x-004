<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<metadata>Dark metallic mobile theme — Obsidian (near black) — generated from svg/dev-home.svg</metadata>
  <defs>
    <linearGradient id="mt-base" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#2c323b"/>
      <stop offset="0.52" stop-color="#191d23"/>
      <stop offset="1" stop-color="#0a0c0f"/>
    </linearGradient>
    <radialGradient id="mt-sheen" cx="0.24" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#e8f0fa" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#e8f0fa" stop-opacity="0.028"/>
      <stop offset="1" stop-color="#e8f0fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mt-rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8f9cad" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#2a313a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5f6b7a" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="mt-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mt-brush" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <path d="M0 0v6" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="mt-clip">
      <rect x="8" y="8" width="240" height="240" rx="58"/>
    </clipPath>
    <filter id="mt-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="mt-inset" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="mt-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#c8dcf2" flood-opacity="0.62"/>
    </filter>
  </defs>

  <!-- metal tile -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#mt-base)"/>
  <g clip-path="url(#mt-clip)">
    <rect x="8" y="8" width="240" height="240" fill="url(#mt-brush)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#mt-sheen)"/>
    <!-- inner shadow around the edges -->
    <rect x="15" y="15" width="226" height="226" rx="52"
          fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="16" filter="url(#mt-inset)"/>
    <!-- top face highlight -->
    <rect x="8" y="8" width="240" height="240" fill="url(#mt-top)"/>
  </g>
  <!-- metallic rim -->
  <rect x="9" y="9" width="238" height="238" rx="57"
        fill="none" stroke="url(#mt-rim)" stroke-width="2"/>
  <!-- machined face the artwork sits on -->
  <rect x="42" y="42" width="172" height="172" rx="40" fill="#ffffff" fill-opacity="0.055"/>
  <rect x="42" y="42" width="172" height="172" rx="40" fill="none" stroke="url(#mt-rim)" stroke-opacity="0.75" stroke-width="2"/>

  <!-- artwork -->
  <g transform="translate(44.0000 44.0000) scale(0.656250)">
    <g filter="url(#mt-shadow)">
<defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7b61ff"/>
      <stop offset="0.5" stop-color="#4c7dff"/>
      <stop offset="1" stop-color="#22b8cf"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#glass)"/>

  <!-- house -->
  <path d="M128 62l74 62-14 17-60-50-60 50-14-17z" fill="#ffffff"/>
  <path d="M78 118v62a10 10 0 0 0 10 10h80a10 10 0 0 0 10-10v-62l-50-41z" fill="#ffffff" opacity="0.92"/>

  <!-- code chevrons -->
  <g stroke="#4c7dff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M112 148l-16 16 16 16"/>
    <path d="M144 148l16 16-16 16"/>
    <path d="M132 144l-8 40"/>
  </g>

    </g>
  </g>
</svg>
