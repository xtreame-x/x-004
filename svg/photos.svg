<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7fd4ff"/>
      <stop offset="0.55" stop-color="#4a9dff"/>
      <stop offset="1" stop-color="#2b6fe0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5bd6a4"/>
      <stop offset="1" stop-color="#16a06a"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fae86"/>
      <stop offset="1" stop-color="#0d7a52"/>
    </linearGradient>
  </defs>

  <!-- back card -->
  <g transform="rotate(-2 128 128)">
    <rect x="52" y="44" width="152" height="168" rx="14" fill="url(#card)" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="68" y="60" width="120" height="104" rx="8" fill="#dbe6f3"/>
    <circle cx="104" cy="96" r="11" fill="#b8cbe2"/>
    <path d="M68 146l30-30 24 24 20-18 26 30z" fill="#c7d7ea"/>
    <g fill="#c9d4e2">
      <rect x="68" y="180" width="72" height="8" rx="4"/>
      <rect x="68" y="196" width="46" height="8" rx="4"/>
    </g>
  </g>

  <!-- front card -->
  <g transform="rotate(6 128 128)">
    <rect x="66" y="56" width="140" height="156" rx="14" fill="#ffffff" stroke="#c4cfdd" stroke-width="4"/>
    <clipPath id="ph"><rect x="78" y="68" width="116" height="100" rx="9"/></clipPath>
    <g clip-path="url(#ph)">
      <rect x="78" y="68" width="116" height="100" fill="url(#sky)"/>
      <circle cx="158" cy="96" r="13" fill="#fff3b0"/>
      <path d="M78 150c14-18 26-26 38-18s18 14 26 6 20-16 32-4l20 22v20H78z" fill="url(#hill)"/>
      <path d="M78 158c16-10 28-8 38 2s22 12 34 2 24-8 34 0v14H78z" fill="url(#hill2)"/>
    </g>
    <g fill="#b9c6d6">
      <rect x="78" y="180" width="66" height="9" rx="4.5"/>
      <rect x="78" y="196" width="40" height="9" rx="4.5"/>
    </g>
  </g>
